<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>艾爾之光｜排團表</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f7f7fb,#171820);--panel:light-dark(#fff,#22242d);--panel2:light-dark(#f1f2f7,#2a2d38);--text:light-dark(#252631,#f2f3f7);--muted:light-dark(#747785,#aeb2c0);--line:light-dark(#dddfe8,#3b3e49);--accent:#9b82e8;--accent2:#d9cef9}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background-color:var(--bg)}
header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}h1{font-size:20px;margin:0}button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:white}.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 66px)}aside{border-right:1px solid var(--line);padding:18px;background:var(--panel)}.section{margin-bottom:22px}.section h2{font-size:14px;margin:0 0 10px}.item{padding:10px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin:7px 0;cursor:grab}.item small{display:block;color:var(--muted);margin-top:3px}.main{overflow:auto;padding:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.hint{color:var(--muted);font-size:13px}.week{display:grid;grid-template-columns:70px repeat(7,minmax(125px,1fr));min-width:1000px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}.head{padding:11px;text-align:center;font-weight:700;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel2)}.time{padding:10px 7px;text-align:center;color:var(--muted);font-size:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.cell{min-height:68px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}.cell.over{background:light-dark(#f0eaff,#302c3b)}.raid{padding:7px;border-radius:8px;background:var(--accent2);color:#3d315f;margin-bottom:5px;font-size:12px;cursor:pointer}.raid b{display:block}.char{padding:5px 7px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:11px;margin-top:4px;cursor:grab}.empty{color:var(--muted);font-size:11px;text-align:center;padding-top:22px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(620px,100%);max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row input,.row select{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text)}.pill{font-size:11px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)} }
</style>
</head>
<body><div id="app">
<header><h1>艾爾之光｜排團表</h1><div><button id="save">儲存</button> <button class="primary" id="manage">玩家資料庫</button></div></header>
<div class="layout"><aside><div class="section"><h2>副本／關卡</h2><div id="raids"></div><button id="addRaid">＋新增關卡</button></div><div class="section"><h2>玩家角色</h2><div id="chars"></div><div class="pill">把角色拖進已建立的副本卡即可加入隊伍</div></div></aside>
<main class="main"><div class="toolbar"><div><b>本週排團</b><div class="hint">把關卡拖到時間格，再把角色拖進副本。</div></div><div><button id="prev">‹</button> <span id="weekLabel">本週</span> <button id="next">›</button></div></div><div class="week" id="week"></div></main></div>
</div>
<div class="modal" id="modal"><div class="dialog"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">玩家資料庫</h2><button id="close">關閉</button></div><p class="hint">這裡可以直接線上新增、修改、刪除玩家與角色。資料會保存在目前瀏覽器。</p><div id="db"></div><button class="primary" id="addPlayer">＋新增玩家</button></div></div>
<script>
const state={players:[{name:'苡柔',chars:['ADD','MP','DB']},{name:'小明',chars:['DB','KE']},{name:'小華',chars:['CA','CU']}],raids:['深淵','奧爾德里奇','每週副本'],events:{}};
const times=['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00','23:00']; const days=['一','二','三','四','五','六','日'];
let weekOffset=0; const key=(d,t)=>`${weekOffset}|${d}|${t}`;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderSide(){raids.innerHTML=state.raids.map((r,i)=>`<div class="item" draggable="true" data-raid="${i}"><b>${esc(r)}</b><small>拖到時間表</small></div>`).join('');chars.innerHTML=state.players.flatMap(p=>p.chars.map(c=>`<div class="item" draggable="true" data-char="${esc(p.name)}|${esc(c)}"><b>${esc(c)}</b><small>${esc(p.name)}</small></div>`)).join('');
 document.querySelectorAll('[data-raid]').forEach(x=>x.ondragstart=e=>e.dataTransfer.setData('raid',x.dataset.raid));document.querySelectorAll('[data-char]').forEach(x=>x.ondragstart=e=>e.dataTransfer.setData('char',x.dataset.char));}
function renderWeek(){let h='<div class="head">時間</div>'+days.map(d=>`<div class="head">週${d}</div>`).join('');for(const t of times){h+=`<div class="time">${t}</div>`;for(let d=0;d<7;d++){const arr=state.events[key(d,t)]||[];h+=`<div class="cell" data-cell="${d}|${t}">${arr.length?arr.map((e,i)=>e.type==='raid'?`<div class="raid" data-open="${d}|${t}|${i}"><b>${esc(e.name)}</b><span>${e.chars.length}/6 人</span>${e.chars.map(c=>`<div class="char">${esc(c.player)}｜${esc(c.char)}</div>`).join('')}</div>`:`<div class="char">${esc(e.player)}｜${esc(e.char)}</div>`).join(''):'<div class="empty">＋</div>'}</div>`}}week.innerHTML=h;document.querySelectorAll('.cell').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');c.ondrop=e=>{e.preventDefault();c.classList.remove('over');const [d,t]=c.dataset.cell.split('|');const k=key(d,t);state.events[k] ||= [];const ri=e.dataTransfer.getData('raid');const ch=e.dataTransfer.getData('char');if(ri){state.events[k].push({type:'raid',name:state.raids[ri],chars:[]})}else if(ch){const [player,char]=ch.split('|');const raid=state.events[k].find(x=>x.type==='raid');if(raid)raid.chars.push({player,char});else alert('請先把副本拖進時間格，再加入角色。')}renderWeek();saveLocal()}});document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openRaid(x.dataset.open));}
function openRaid(spec){const [d,t,i]=spec.split('|');const e=(state.events[key(d,t)]||[])[i];if(!e)return;const names=e.chars.length?e.chars.map(x=>`• ${esc(x.player)}｜${esc(x.char)}`).join('<br>'):'目前還沒有隊員';document.querySelector('.dialog').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">${esc(e.name)}</h2><button onclick="closeModal()">關閉</button></div><p class="hint">週${days[d]} ${t}　｜　${e.chars.length}/6 人</p><hr><p>${names}</p><button class="primary" onclick="removeRaid('${d}','${t}',${i})">刪除這個排團</button>`;modal.classList.add('show');}
function removeRaid(d,t,i){const a=state.events[key(d,t)];a.splice(i,1);if(!a.length)delete state.events[key(d,t)];closeModal();renderWeek();saveLocal()}
function renderDB(){document.querySelector('.dialog').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">玩家資料庫</h2><button onclick="closeModal()">關閉</button></div><p class="hint">直接修改後按「儲存資料庫」。</p>${state.players.map((p,i)=>`<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0"><div class="row"><input value="${esc(p.name)}" onchange="state.players[${i}].name=this.value"><button onclick="state.players.splice(${i},1);renderDB()">刪除玩家</button></div>${p.chars.map((c,j)=>`<div class="row"><input value="${esc(c)}" onchange="state.players[${i}].chars[${j}]=this.value"><button onclick="state.players[${i}].chars.splice(${j},1);renderDB()">刪除</button></div>`).join('')}<button onclick="state.players[${i}].chars.push('新角色');renderDB()">＋新增角色</button></div>`).join('')}<button class="primary" onclick="state.players.push({name:'新玩家',chars:['新角色']});renderDB()">＋新增玩家</button> <button onclick="saveLocal();renderSide();renderWeek();closeModal()">儲存資料庫</button>`}
function saveLocal(){localStorage.setItem('elsword_schedule_demo',JSON.stringify(state));}function load(){try{Object.assign(state,JSON.parse(localStorage.getItem('elsword_schedule_demo'))||{})}catch(e){}}function closeModal(){modal.classList.remove('show');renderDB()}window.closeModal=closeModal;window.removeRaid=removeRaid;window.renderDB=renderDB;
addRaid.onclick=()=>{const n=prompt('關卡名稱？');if(n){state.raids.push(n);renderSide();saveLocal()}};manage.onclick=()=>{renderDB();modal.classList.add('show')};close.onclick=closeModal;save.onclick=()=>{saveLocal();alert('已儲存到此瀏覽器')};prev.onclick=()=>{weekOffset--;renderWeek()};next.onclick=()=>{weekOffset++;renderWeek()};
load();renderSide();renderWeek();
</script></body></html>
