<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>艾爾之光｜排團表</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f7f7fb,#171820);--panel:light-dark(#fff,#22242d);--panel2:light-dark(#f1f2f7,#2a2d38);--text:light-dark(#252631,#f2f3f7);--muted:light-dark(#747785,#aeb2c0);--line:light-dark(#dddfe8,#3b3e49);--accent:#9b82e8;--accent2:#d9cef9}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background-color:var(--bg)}
header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}h1{font-size:20px;margin:0}button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:white}.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 66px)}aside{border-right:1px solid var(--line);padding:18px;background:var(--panel)}.section{margin-bottom:22px}.section h2{font-size:14px;margin:0 0 10px}.item{padding:10px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin:7px 0;cursor:grab}.item small{display:block;color:var(--muted);margin-top:3px}.main{overflow:auto;padding:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.hint{color:var(--muted);font-size:13px}.week{display:grid;grid-template-columns:70px repeat(7,minmax(125px,1fr));min-width:1000px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}.head{padding:11px;text-align:center;font-weight:700;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel2)}.time{padding:10px 7px;text-align:center;color:var(--muted);font-size:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.cell{min-height:68px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}.cell.over{background:light-dark(#f0eaff,#302c3b)}.raid{padding:7px;border-radius:8px;background:var(--accent2);color:#3d315f;margin-bottom:5px;font-size:12px;cursor:pointer}.raid b{display:block}.char{padding:5px 7px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:11px;margin-top:4px;cursor:grab}.empty{color:var(--muted);font-size:11px;text-align:center;padding-top:22px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(620px,100%);max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row input,.row select{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text)}.pill{font-size:11px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)} }
</style>
<style>
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--accent2);display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px;font-weight:700;color:#4a3d6c}.avatar.small{width:24px;height:24px;flex-basis:24px;font-size:11px}.player-title{display:flex;align-items:center;gap:8px}.raid-meta{font-size:11px;color:var(--muted);margin-top:3px}.raid-note{display:block;margin-top:3px;font-size:10px;opacity:.75}.raid-card{padding:10px;background:var(--panel2);border-radius:10px;margin:9px 0}.raid-card b{display:block;margin-bottom:5px}.form-card{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.row textarea{min-height:90px;resize:vertical}.row textarea,.row input[type=file]{flex:1}
</style>
</head>
<body><div id="app">
<header><h1>艾爾之光｜排團表</h1><div><button id="save">儲存</button> <button class="primary" id="manage">玩家資料庫</button></div></header>
<div class="layout"><aside><div class="section"><div style="display:flex;justify-content:space-between;align-items:center"><h2>副本／關卡</h2><button id="toggleRaids">收合</button></div><div id="raids"></div><button id="addRaid">＋新增關卡</button></div><div class="section"><div style="display:flex;justify-content:space-between;align-items:center"><h2>玩家角色</h2><button id="toggleChars">收合</button></div><div id="chars"></div><div class="pill">把角色拖進已建立的副本卡即可加入隊伍</div></div></aside>
<main class="main"><div class="toolbar"><div><b>本週排團</b><div class="hint">把關卡拖到時間格，再把角色拖進副本。</div></div><div><button id="prev">‹</button> <span id="weekLabel">本週</span> <button id="next">›</button></div></div><div class="week" id="week"></div></main></div>
</div>
<div class="modal" id="modal"><div class="dialog"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">玩家資料庫</h2><button id="close">關閉</button></div><p class="hint">這裡可以直接線上新增、修改、刪除玩家與角色。資料會保存在目前瀏覽器。</p><div id="db"></div><button class="primary" id="addPlayer">＋新增玩家</button></div></div>
<script>
const times=['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00','23:00'],days=['一','二','三','四','五','六','日'];let weekOffset=0,charsCollapsed=false,raidsCollapsed=false,editIndex=-1;
const state={players:[{name:'苡柔',avatar:'',chars:['ADD','MP','DB'],open:true},{name:'小明',avatar:'',chars:['DB','KE'],open:false},{name:'小華',avatar:'',chars:['CA','CU'],open:false}],raids:[{name:'深淵',max:6,info:'',mechanic:''},{name:'奧爾德里奇',max:6,info:'',mechanic:''},{name:'每週副本',max:6,info:'',mechanic:''}],events:{}};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),key=(d,t)=>weekOffset+'|'+d+'|'+t;
function saveLocal(){localStorage.setItem('elsword_schedule_demo',JSON.stringify(state))}
function load(){try{const x=JSON.parse(localStorage.getItem('elsword_schedule_demo'));if(x){state.players=(x.players||state.players).map(p=>({name:p.name||'未命名',avatar:p.avatar||'',chars:p.chars||[],open:!!(p.open??p._open)}));state.raids=(x.raids||state.raids).map(r=>typeof r==='string'?{name:r,max:6,info:'',mechanic:''}:{name:r.name||'未命名',max:Number(r.max)||6,info:r.info||'',mechanic:r.mechanic||''});state.events=x.events||{}}}catch(e){}}
function av(p,small=false){return p.avatar?'<img class="avatar'+(small?' small':'')+'" src="'+esc(p.avatar)+'">':'<span class="avatar'+(small?' small':'')+'">'+esc((p.name||'?')[0])+'</span>'}
function raidByName(n){return state.raids.find(r=>r.name===n)||{name:n,max:6,info:'',mechanic:''}}
function renderSide(){raids.innerHTML=raidsCollapsed?'':state.raids.map((r,i)=>'<div class="item" draggable="true" data-ri="'+i+'"><b>'+esc(r.name)+'</b><small>👥 最多 '+r.max+' 人</small>'+(r.mechanic?'<small>⚙ '+esc(r.mechanic)+'</small>':'')+'<div><button data-edit="'+i+'">編輯</button> <button data-del="'+i+'">刪除</button></div></div>').join('');chars.innerHTML=charsCollapsed?'':state.players.map((p,i)=>'<div class="form-card"><div class="player-title" data-player="'+i+'">'+av(p)+'<span><b>'+esc(p.name)+'</b><small>'+p.chars.length+' 隻角色　'+(p.open?'▾':'▸')+'</small></span></div><div style="display:'+(p.open?'block':'none')+'">'+p.chars.map(c=>'<div class="item" draggable="true" data-char="'+esc(p.name)+'|'+esc(c)+'">'+esc(c)+'</div>').join('')+'</div></div>').join('');document.querySelectorAll('[data-ri]').forEach(x=>x.ondragstart=e=>e.dataTransfer.setData('raid',x.dataset.ri));document.querySelectorAll('[data-char]').forEach(x=>x.ondragstart=e=>e.dataTransfer.setData('char',x.dataset.char));document.querySelectorAll('[data-player]').forEach(x=>x.onclick=()=>{state.players[+x.dataset.player].open=!state.players[+x.dataset.player].open;renderSide();saveLocal()});document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=e=>{e.stopPropagation();editRaid(+x.dataset.edit)});document.querySelectorAll('[data-del]').forEach(x=>x.onclick=e=>{e.stopPropagation();deleteRaid(+x.dataset.del)})}
function renderWeek(){let h='<div class="head">時間</div>'+days.map(d=>'<div class="head">週'+d+'</div>').join('');times.forEach(t=>{h+='<div class="time">'+t+'</div>';for(let d=0;d<7;d++){const a=state.events[key(d,t)]||[];h+='<div class="cell" data-cell="'+d+'|'+t+'">'+(a.length?a.map((e,i)=>e.type==='raid'?'<div class="raid" data-open="'+d+'|'+t+'|'+i+'" data-raid-drop="'+d+'|'+t+'|'+i+'"><b>'+esc(e.name)+'</b><span>'+e.chars.length+'/'+raidByName(e.name).max+' 人</span>'+e.chars.map(c=>{const p=state.players.find(x=>x.name===c.player)||{name:c.player,avatar:''};return '<div class="char">'+av(p,true)+' '+esc(c.player)+'｜'+esc(c.char)+'</div>'}).join('')+'</div>':'<div class="char">'+esc(e.player)+'｜'+esc(e.char)+'</div>').join(''):'<div class="empty">＋</div>')+'</div>'}});week.innerHTML=h;document.querySelectorAll('.cell').forEach(c=>{c.ondragover=e=>{if(!e.dataTransfer.types.includes('char')){e.preventDefault();c.classList.add('over')}};c.ondragleave=()=>c.classList.remove('over');c.ondrop=e=>{e.preventDefault();c.classList.remove('over');const [d,t]=c.dataset.cell.split('|'),k=key(d,t),ri=e.dataTransfer.getData('raid');state.events[k]??=[];if(ri){const r=state.raids[+ri];state.events[k].push({type:'raid',name:r.name,chars:[],info:'',mechanic:''});renderWeek();saveLocal()}}});document.querySelectorAll('[data-raid-drop]').forEach(x=>{x.ondragover=e=>{if(e.dataTransfer.types.includes('char')){e.preventDefault();x.style.outline='2px solid var(--accent)'}};x.ondragleave=()=>x.style.outline='';x.ondrop=e=>{e.preventDefault();x.style.outline='';const [d,t,i]=x.dataset.raidDrop.split('|'),r=(state.events[key(d,t)]||[])[+i],ch=e.dataTransfer.getData('char');if(!r||!ch)return;const [player,char]=ch.split('|');if(r.chars.length>=raidByName(r.name).max)alert('這個副本已達人數上限。');else if(r.chars.some(x=>x.player===player))alert('同一位玩家只能帶一個角色。');else{r.chars.push({player,char});renderWeek();saveLocal()}}});document.querySelectorAll('[data-open]').forEach(x=>x.onclick=e=>{if(e.target.closest('.char'))return;openRaid(x.dataset.open)})}
function show(html){document.querySelector('.dialog').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function openRaid(s){const [d,t,i]=s.split('|'),e=(state.events[key(d,t)]||[])[+i];if(!e)return;const r=raidByName(e.name);show('<div class="row"><h2 style="margin:0">'+esc(e.name)+'</h2><button onclick="closeModal()">關閉</button></div><p class="hint">週'+days[d]+' '+t+'　｜　'+e.chars.length+'/'+r.max+' 人</p>'+(e.info?'<div class="raid-card"><b>這一團的關卡／備註</b><div style="white-space:pre-wrap">'+esc(e.info)+'</div></div>':'')+(e.mechanic?'<div class="raid-card"><b>這一團的機制／誰解／站位</b><div style="white-space:pre-wrap">'+esc(e.mechanic)+'</div></div>':'')+(e.chars.length?e.chars.map(c=>'<div class="char">'+esc(c.player)+'｜'+esc(c.char)+'</div>').join(''):'<p class="hint">目前還沒有隊員</p>')+'<div class="row"><button class="primary" id="editEventBtn">編輯這一團說明</button><button onclick="removeRaid('+d+','+JSON.stringify(t)+','+i+')">刪除這個排團</button></div>');document.getElementById('editEventBtn').onclick=()=>editEvent(+d,t,+i)}
function removeRaid(d,t,i){const a=state.events[key(d,t)];a.splice(i,1);if(!a.length)delete state.events[key(d,t)];saveLocal();closeModal();renderWeek()}
function editEvent(d,t,i){const e=(state.events[key(d,t)]||[])[+i];if(!e)return;show('<div class="row"><h2 style="margin:0">編輯這一團</h2><button onclick="closeModal()">關閉</button></div><p class="hint">只有這個時間格的這一團會套用，不會影響其他同名副本。</p><div class="row"><label>關卡／備註</label><textarea id="ei" placeholder="例如：第一關先打左邊，第二關集合中間。">'+esc(e.info||'')+'</textarea></div><div class="row"><label>機制／誰解／站位</label><textarea id="ex" placeholder="例如：苡柔解左邊，小明解右邊，小華站中間。">'+esc(e.mechanic||'')+'</textarea></div><button class="primary" id="saveEventBtn">儲存這一團</button>');document.getElementById('saveEventBtn').onclick=()=>saveEvent(+d,t,+i)}
function saveEvent(d,t,i){const e=(state.events[key(d,t)]||[])[+i];if(!e)return;e.info=document.getElementById('ei').value.trim();e.mechanic=document.getElementById('ex').value.trim();saveLocal();closeModal();renderWeek()}
function renderDB(){show('<div class="row"><h2 style="margin:0">玩家資料庫</h2><button onclick="closeModal()">關閉</button></div><p class="hint">可修改玩家、角色與頭像。頭像只會儲存在這個瀏覽器。</p>'+state.players.map((p,i)=>'<div class="form-card"><div class="row">'+av(p)+'<input value="'+esc(p.name)+'" onchange="state.players['+i+'].name=this.value"><button onclick="state.players.splice('+i+',1);renderDB()">刪除玩家</button></div><div class="row"><input type="file" accept="image/*" onchange="avatarFile(event,'+i+')"><button onclick="state.players['+i+'].avatar=\'\';renderDB()">移除頭像</button></div>'+p.chars.map((c,j)=>'<div class="row"><input value="'+esc(c)+'" onchange="state.players['+i+'].chars['+j+']=this.value"><button onclick="state.players['+i+'].chars.splice('+j+',1);renderDB()">刪除</button></div>').join('')+'<button onclick="state.players['+i+'].chars.push(\'新角色\');renderDB()">＋新增角色</button></div>').join('')+'<button class="primary" onclick="state.players.push({name:\'新玩家\',avatar:\'\',chars:[\'新角色\'],open:false});renderDB()">＋新增玩家</button> <button onclick="saveLocal();renderSide();renderWeek();closeModal()">儲存資料庫</button>')}
function avatarFile(e,i){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{state.players[i].avatar=rd.result;saveLocal();renderDB();renderSide();renderWeek()};rd.readAsDataURL(f)}
function raidForm(i){editIndex=i;const r=i<0?{name:'',max:6,info:'',mechanic:''}:state.raids[i];show('<div class="row"><h2 style="margin:0">'+(i<0?'新增':'編輯')+'副本</h2><button onclick="closeModal()">關閉</button></div><div class="row"><label>名稱</label><input id="rn" value="'+esc(r.name)+'"></div><div class="row"><label>人數上限</label><input id="rm" type="number" min="1" value="'+r.max+'"></div><div class="row"><label>副本說明／關卡</label><textarea id="ri" placeholder="例如：第一關、第二關要做什麼？">'+esc(r.info)+'</textarea></div><div class="row"><label>機制／誰解／站位</label><textarea id="rx" placeholder="例如：苡柔解機制、小明左邊、小華右邊……">'+esc(r.mechanic)+'</textarea></div><button class="primary" onclick="saveRaid()">儲存</button>')}
function saveRaid(){const name=rn.value.trim();if(!name)return alert('請輸入副本名稱');const r={name,max:Math.max(1,+rm.value||6),info:ri.value.trim(),mechanic:rx.value.trim()};if(editIndex<0)state.raids.push(r);else{const old=state.raids[editIndex].name;state.raids[editIndex]=r;Object.values(state.events).forEach(a=>a.forEach(e=>{if(e.type==='raid'&&e.name===old)e.name=name}))}saveLocal();closeModal();renderSide();renderWeek()}
function editRaid(i){raidForm(i)}function deleteRaid(i){const n=state.raids[i].name;if(!confirm('確定刪除「'+n+'」？已排好的同名關卡也會移除。'))return;state.raids.splice(i,1);Object.keys(state.events).forEach(k=>{state.events[k]=state.events[k].filter(e=>e.name!==n);if(!state.events[k].length)delete state.events[k]});saveLocal();renderSide();renderWeek()}
load();renderSide();renderWeek();addRaid.onclick=()=>raidForm(-1);manage.onclick=renderDB;close.onclick=closeModal;save.onclick=()=>{saveLocal();alert('已儲存到此瀏覽器')};toggleChars.onclick=()=>{charsCollapsed=!charsCollapsed;toggleChars.textContent=charsCollapsed?'展開':'收合';renderSide()};toggleRaids.onclick=()=>{raidsCollapsed=!raidsCollapsed;toggleRaids.textContent=raidsCollapsed?'展開':'收合';renderSide()};prev.onclick=()=>{weekOffset--;renderWeek()};next.onclick=()=>{weekOffset++;renderWeek()};
</script></body></html>
